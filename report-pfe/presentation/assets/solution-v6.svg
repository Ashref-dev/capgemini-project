<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 660" role="img" aria-labelledby="title desc"><title id="title">IntelliConnect solution map</title><desc id="desc">Three connected capabilities centralise, structure, and assist partnership operations.</desc><style>.ink{fill:#0b1826}.blue{fill:#0070ad}.muted{fill:#52687a}.pale{fill:#eaf5fa}.white{fill:#fff}.t{font:700 40px Arial,sans-serif}.s{font:500 22px Arial,sans-serif}.k{font:700 18px Arial,sans-serif;letter-spacing:2px}.node{stroke:#0070ad;stroke-width:4}.link{fill:none;stroke:#0070ad;stroke-width:5}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4z" fill="#0070ad"/></marker></defs><text x="64" y="62" class="k blue">FROM FRAGMENTED RECORDS TO GOVERNED INTELLIGENCE</text><path d="M555 306H714M1086 306H1245" class="link" marker-end="url(#a)"/><rect x="64" y="142" width="490" height="328" rx="18" class="white node"/><rect x="714" y="142" width="490" height="328" rx="18" class="pale node"/><rect x="1246" y="142" width="490" height="328" rx="18" class="white node"/><circle cx="132" cy="213" r="35" class="blue"/><path d="M117 207h30v26h-30zM122 197h20" fill="none" stroke="#fff" stroke-width="4"/><text x="190" y="220" class="t ink">Centralise</text><text x="104" y="294" class="s muted">Partners · projects · documents</text><text x="104" y="332" class="s muted">One operational source of truth</text><text x="104" y="414" class="k blue">REPLACES</text><text x="104" y="445" class="s ink">Files, links, email trails</text><circle cx="782" cy="213" r="35" class="blue"/><path d="M767 214h30M782 199v30" fill="none" stroke="#fff" stroke-width="4"/><text x="840" y="220" class="t ink">Structure</text><text x="754" y="294" class="s muted">Roles · workflows · ownership</text><text x="754" y="332" class="s muted">Status history and auditability</text><text x="754" y="414" class="k blue">MAKES EXPLICIT</text><text x="754" y="445" class="s ink">Who did what, and why</text><circle cx="1314" cy="213" r="35" class="blue"/><path d="M1300 221l12-13 10 8 15-19" fill="none" stroke="#fff" stroke-width="4"/><text x="1372" y="220" class="t ink">Index and assist</text><text x="1286" y="294" class="s muted">Search · scoring · cited AI reports</text><text x="1286" y="332" class="s muted">Human decisions remain in control</text><text x="1286" y="414" class="k blue">ENABLES</text><text x="1286" y="445" class="s ink">Faster, evidence-based review</text><rect x="64" y="538" width="1672" height="58" rx="29" class="pale"/><text x="900" y="576" text-anchor="middle" class="s ink">One governed platform for partnership management, delivery evidence, analysis, and reporting.</text></svg>