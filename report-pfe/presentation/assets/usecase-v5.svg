<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 820" role="img" aria-labelledby="title desc">
  <title id="title">Global IntelliConnect interaction map</title>
  <desc id="desc">Public visitor, employee roles, and partner access the appropriate public, internal, or ownership-scoped platform capabilities.</desc>
  <style>.ink{fill:#0b1826}.muted{fill:#52687a}.blue{fill:#0070ad}.white{fill:#fff}.zone{fill:#f4f9fb;stroke:#0070ad;stroke-width:3}.actor{fill:#0b1826}.node{fill:#fff;stroke:#0070ad;stroke-width:3}.rail{fill:#eaf5fa;stroke:#0070ad;stroke-width:3}.link{stroke:#0070ad;stroke-width:4;fill:none}.t{font:700 28px Arial,sans-serif}.s{font:500 19px Arial,sans-serif}.k{font:700 17px Arial,sans-serif;letter-spacing:1.7px}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0070ad"/></marker></defs>
  <text x="52" y="51" class="k blue">ACTOR AND ACCESS SCOPE</text><text x="500" y="51" class="k blue">GLOBAL PLATFORM INTERACTIONS</text>
  <rect x="52" y="92" width="335" height="105" rx="14" class="actor"/><text x="129" y="138" class="t white">Public visitor</text><text x="173" y="169" class="s white">Public entry</text>
  <rect x="500" y="92" width="1248" height="105" rx="14" class="zone"/><text x="535" y="135" class="t ink">Public request intake</text><rect x="1150" y="112" width="330" height="64" rx="32" class="node"/><text x="1238" y="153" class="t ink">Submit request</text><path d="M387 145H1142" class="link" marker-end="url(#arrow)"/>
  <rect x="52" y="256" width="335" height="134" rx="14" class="actor"/><text x="143" y="301" class="t white">Employee</text><text x="84" y="333" class="s white">Admin · Manager · Commercial</text><text x="134" y="360" class="s white">Analyst · Human resources</text>
  <rect x="500" y="235" width="1248" height="271" rx="14" class="zone"/><text x="535" y="277" class="t ink">Employee workspace</text>
  <rect x="535" y="309" width="254" height="76" rx="12" class="node"/><text x="570" y="355" class="t ink">Review &amp; decide</text><rect x="828" y="309" width="254" height="76" rx="12" class="node"/><text x="863" y="355" class="t ink">Manage lifecycle</text><rect x="1121" y="309" width="280" height="76" rx="12" class="node"/><text x="1147" y="344" class="t ink">Communications</text><text x="1165" y="369" class="s ink">and documents</text><rect x="1440" y="309" width="270" height="76" rx="12" class="node"/><text x="1485" y="355" class="t ink">Track projects</text>
  <rect x="535" y="407" width="254" height="64" rx="12" class="node"/><text x="571" y="447" class="t ink">BI dashboards</text><rect x="828" y="407" width="254" height="64" rx="12" class="node"/><text x="877" y="447" class="t ink">Score &amp; rank</text><rect x="1121" y="407" width="280" height="64" rx="12" class="node"/><text x="1162" y="447" class="t ink">AI assistant &amp; reports</text><path d="M387 324H527" class="link" marker-end="url(#arrow)"/><path d="M789 347H820M1082 347H1113M1401 347H1432" class="link" marker-end="url(#arrow)"/>
  <rect x="500" y="535" width="1248" height="75" rx="14" class="rail"/><text x="535" y="581" class="t ink">Govern &amp; audit</text><path d="M850 573H1180" class="link"/><text x="1240" y="581" class="t ink">HR &amp; recruitment</text>
  <rect x="52" y="662" width="335" height="105" rx="14" class="actor"/><text x="168" y="708" class="t white">Partner</text><text x="120" y="739" class="s white">Ownership-scoped</text>
  <rect x="500" y="662" width="1248" height="105" rx="14" class="zone"/><text x="535" y="706" class="t ink">Partner portal</text><rect x="1115" y="683" width="370" height="62" rx="31" class="node"/><text x="1192" y="723" class="t ink">Partner self-service</text><path d="M387 714H1107" class="link" marker-end="url(#arrow)"/>
  <text x="500" y="808" class="s muted">Role-aware employee access and partner ownership checks enforce the scope of each workspace.</text>
</svg>