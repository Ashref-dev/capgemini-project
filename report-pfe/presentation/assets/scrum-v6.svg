<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 660" role="img" aria-labelledby="title desc"><title id="title">Agile Scrum delivery model</title><desc id="desc">An iterative Scrum cycle with six IntelliConnect delivery sprints.</desc><style>.ink{fill:#0b1826}.blue{fill:#0070ad}.muted{fill:#52687a}.pale{fill:#eaf5fa}.white{fill:#fff}.t{font:700 32px Arial,sans-serif}.s{font:500 21px Arial,sans-serif}.k{font:700 17px Arial,sans-serif;letter-spacing:2px}.line{fill:none;stroke:#0070ad;stroke-width:5}.node{fill:#fff;stroke:#0070ad;stroke-width:3}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#0070ad"/></marker></defs><text x="64" y="62" class="k blue">AGILE SCRUM · ITERATE WITH REVIEWABLE INCREMENTS</text><circle cx="900" cy="265" r="112" class="pale"/><text x="900" y="252" text-anchor="middle" class="t ink">Sprint</text><text x="900" y="284" text-anchor="middle" class="s muted">reviewable increment</text><rect x="246" y="182" width="250" height="92" rx="46" class="node"/><text x="371" y="224" text-anchor="middle" class="t ink">Backlog</text><text x="371" y="250" text-anchor="middle" class="s muted">prioritise value</text><rect x="600" y="82" width="250" height="92" rx="46" class="node"/><text x="725" y="124" text-anchor="middle" class="t ink">Plan</text><text x="725" y="150" text-anchor="middle" class="s muted">define sprint goal</text><rect x="950" y="82" width="250" height="92" rx="46" class="node"/><text x="1075" y="124" text-anchor="middle" class="t ink">Build</text><text x="1075" y="150" text-anchor="middle" class="s muted">deliver the scope</text><rect x="1304" y="182" width="250" height="92" rx="46" class="node"/><text x="1429" y="224" text-anchor="middle" class="t ink">Verify</text><text x="1429" y="250" text-anchor="middle" class="s muted">test and validate</text><rect x="1128" y="355" width="250" height="92" rx="46" class="node"/><text x="1253" y="397" text-anchor="middle" class="t ink">Review</text><text x="1253" y="423" text-anchor="middle" class="s muted">collect feedback</text><rect x="422" y="355" width="250" height="92" rx="46" class="node"/><text x="547" y="397" text-anchor="middle" class="t ink">Adapt</text><text x="547" y="423" text-anchor="middle" class="s muted">refine backlog</text><path d="M496 228C542 160 565 133 594 128M850 128H944M1200 128C1252 151 1285 182 1298 216M1429 274c-15 43-57 75-146 115M1128 401H678M422 401C310 359 271 292 278 249" class="line" marker-end="url(#a)"/><text x="64" y="536" class="k blue">SIX DELIVERY SPRINTS</text><g class="s ink"><text x="64" y="590">01 Foundation</text><text x="350" y="590">02 Lifecycle</text><text x="636" y="590">03 Collaboration</text><text x="980" y="590">04 Delivery</text><text x="1235" y="590">05 Intelligence</text><text x="1530" y="590">06 Hardening</text></g><path d="M64 616H1736" stroke="#0070ad" stroke-width="6"/></svg>