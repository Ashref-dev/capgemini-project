<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 660" role="img" aria-labelledby="title desc"><title id="title">IntelliConnect system actors</title><desc id="desc">Five employee roles use the internal workspace while partners use an ownership-scoped portal.</desc><style>.ink{fill:#0b1826}.blue{fill:#0070ad}.muted{fill:#52687a}.pale{fill:#eaf5fa}.white{fill:#fff}.t{font:700 30px Arial,sans-serif}.s{font:500 20px Arial,sans-serif}.k{font:700 17px Arial,sans-serif;letter-spacing:2px}.node{fill:#fff;stroke:#0070ad;stroke-width:3}</style><text x="64" y="60" class="k blue">ONE PLATFORM · SIX DISTINCT RESPONSIBILITIES</text><rect x="64" y="108" width="1150" height="438" rx="20" class="pale"/><text x="108" y="158" class="t ink">Employee workspace</text><text x="108" y="190" class="s muted">Role-aware access · scope depends on responsibility</text><g><rect x="108" y="238" width="194" height="222" rx="16" class="node"/><circle cx="205" cy="286" r="28" class="blue"/><path d="M188 320c10-18 25-18 35 0" fill="none" stroke="#0070ad" stroke-width="6"/><text x="205" y="367" text-anchor="middle" class="t ink">Admin</text><text x="205" y="400" text-anchor="middle" class="s muted">Access · audit</text><rect x="326" y="238" width="194" height="222" rx="16" class="node"/><circle cx="423" cy="286" r="28" class="blue"/><path d="M407 289h32M423 273v32" fill="none" stroke="#fff" stroke-width="5"/><text x="423" y="367" text-anchor="middle" class="t ink">Manager</text><text x="423" y="400" text-anchor="middle" class="s muted">Portfolio · action</text><rect x="544" y="238" width="194" height="222" rx="16" class="node"/><circle cx="641" cy="286" r="28" class="blue"/><path d="M625 286h32M641 270v32" fill="none" stroke="#fff" stroke-width="5"/><text x="641" y="367" text-anchor="middle" class="t ink">Commercial</text><text x="641" y="400" text-anchor="middle" class="s muted">Relationship</text><rect x="762" y="238" width="194" height="222" rx="16" class="node"/><circle cx="859" cy="286" r="28" class="blue"/><path d="M842 300l10-14 10 8 14-20" fill="none" stroke="#fff" stroke-width="5"/><text x="859" y="367" text-anchor="middle" class="t ink">Analyst</text><text x="859" y="400" text-anchor="middle" class="s muted">BI · reports</text><rect x="980" y="238" width="194" height="222" rx="16" class="node"/><circle cx="1077" cy="286" r="28" class="blue"/><path d="M1060 286h34M1077 269v34" fill="none" stroke="#fff" stroke-width="5"/><text x="1077" y="367" text-anchor="middle" class="t ink">HR</text><text x="1077" y="400" text-anchor="middle" class="s muted">People operations</text></g><rect x="1260" y="108" width="476" height="438" rx="20" class="white node"/><text x="1304" y="158" class="t ink">Partner portal</text><text x="1304" y="190" class="s muted">Ownership-scoped self-service</text><circle cx="1498" cy="305" r="80" class="blue"/><path d="M1448 337c20-48 80-48 100 0M1498 236c22 0 38 18 38 40s-16 40-38 40-38-18-38-40 16-40 38-40z" fill="none" stroke="#fff" stroke-width="8"/><text x="1498" y="438" text-anchor="middle" class="t ink">Partner</text><text x="1498" y="474" text-anchor="middle" class="s muted">Profile · documents · offers</text><path d="M64 590H1736" stroke="#0070ad" stroke-width="6"/><text x="64" y="636" class="s ink">Shared platform, distinct permissions: no public access to protected data and no partner access beyond its own organisation.</text></svg>