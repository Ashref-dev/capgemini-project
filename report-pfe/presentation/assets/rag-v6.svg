<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 660" role="img" aria-labelledby="title desc"><title id="title">Hybrid retrieval pipeline</title><desc id="desc">Documents are chunked and embedded, then lexical and semantic search are fused, re-ranked, and returned with citations.</desc><style>.ink{fill:#0b1826}.blue{fill:#0070ad}.muted{fill:#52687a}.pale{fill:#eaf5fa}.white{fill:#fff}.t{font:700 27px Arial,sans-serif}.s{font:500 19px Arial,sans-serif}.k{font:700 16px Arial,sans-serif;letter-spacing:1.7px}.node{fill:#fff;stroke:#0070ad;stroke-width:3}.link{fill:none;stroke:#0070ad;stroke-width:5}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#0070ad"/></marker></defs><text x="64" y="62" class="k blue">RETRIEVAL · EVIDENCE BEFORE GENERATION</text><rect x="64" y="150" width="250" height="135" rx="16" class="node"/><text x="98" y="196" class="k blue">01</text><text x="98" y="235" class="t ink">Documents</text><text x="98" y="264" class="s muted">PDFs · notes · records</text><rect x="390" y="150" width="250" height="135" rx="16" class="pale" stroke="#0070ad" stroke-width="3"/><text x="424" y="196" class="k blue">02</text><text x="424" y="235" class="t ink">Chunk and embed</text><text x="424" y="264" class="s muted">1,200 chars · 2,048 dims</text><rect x="720" y="94" width="270" height="115" rx="16" class="node"/><text x="754" y="139" class="k blue">03A · LEXICAL</text><text x="754" y="177" class="t ink">BM25 search</text><rect x="720" y="296" width="270" height="115" rx="16" class="node"/><text x="754" y="341" class="k blue">03B · SEMANTIC</text><text x="754" y="379" class="t ink">Vector search</text><rect x="1070" y="150" width="250" height="135" rx="16" class="pale" stroke="#0070ad" stroke-width="3"/><text x="1104" y="196" class="k blue">04</text><text x="1104" y="235" class="t ink">Fuse and re-rank</text><text x="1104" y="264" class="s muted">Reciprocal Rank Fusion</text><rect x="1400" y="150" width="336" height="135" rx="16" class="node"/><text x="1434" y="196" class="k blue">05</text><text x="1434" y="235" class="t ink">Cited evidence</text><text x="1434" y="264" class="s muted">Top sources near the answer</text><path d="M314 218H382M640 218C674 218 685 151 712 151M640 218C674 218 685 353 712 353M990 151C1028 151 1030 218 1062 218M990 353C1028 353 1030 218 1062 218M1320 218H1392" class="link" marker-end="url(#a)"/><rect x="64" y="500" width="1672" height="66" rx="14" class="pale"/><text x="104" y="541" class="s ink">Measured top-5 hit rate: <tspan font-weight="700">BM25 0.68</tspan> · <tspan font-weight="700">Dense 0.79</tspan> · <tspan font-weight="700">Hybrid 0.88</tspan></text><text x="64" y="623" class="s muted">The system retrieves evidence first; the language model synthesises only after the sources are available.</text></svg>