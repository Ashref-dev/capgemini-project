<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 660" role="img" aria-labelledby="title desc"><title id="title">Partnership process from request to decision</title><desc id="desc">A partnership request is validated, reviewed, activated, operated, and analysed with auditability throughout.</desc><style>.ink{fill:#0b1826}.blue{fill:#0070ad}.muted{fill:#52687a}.pale{fill:#eaf5fa}.white{fill:#fff}.t{font:700 28px Arial,sans-serif}.s{font:500 19px Arial,sans-serif}.k{font:700 17px Arial,sans-serif;letter-spacing:2px}.node{fill:#fff;stroke:#0070ad;stroke-width:3}.line{fill:none;stroke:#0070ad;stroke-width:5}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#0070ad"/></marker></defs><text x="64" y="60" class="k blue">PARTNERSHIP LIFECYCLE · THE OPERATIONAL BACKBONE</text><g><rect x="64" y="174" width="275" height="182" rx="16" class="node"/><text x="102" y="223" class="k blue">01 · PUBLIC ENTRY</text><text x="102" y="270" class="t ink">Request</text><text x="102" y="306" class="s muted">Organisation and collaboration details</text><rect x="405" y="174" width="275" height="182" rx="16" class="pale" stroke="#0070ad" stroke-width="3"/><text x="443" y="223" class="k blue">02 · VALIDATE</text><text x="443" y="270" class="t ink">Qualify</text><text x="443" y="306" class="s muted">Store request · advisory score</text><rect x="746" y="174" width="275" height="182" rx="16" class="node"/><text x="784" y="223" class="k blue">03 · EMPLOYEE REVIEW</text><text x="784" y="270" class="t ink">Decide</text><text x="784" y="306" class="s muted">Accept · request information · reject</text><rect x="1087" y="174" width="275" height="182" rx="16" class="pale" stroke="#0070ad" stroke-width="3"/><text x="1125" y="223" class="k blue">04 · RELATIONSHIP</text><text x="1125" y="270" class="t ink">Activate</text><text x="1125" y="306" class="s muted">Profile · contracts · offers · contacts</text><rect x="1428" y="174" width="308" height="182" rx="16" class="node"/><text x="1466" y="223" class="k blue">05 · DELIVERY + INSIGHT</text><text x="1466" y="270" class="t ink">Operate</text><text x="1466" y="306" class="s muted">Projects · BI · scoring · AI reports</text></g><path d="M339 265H397M680 265H738M1021 265H1079M1362 265H1420" class="line" marker-end="url(#a)"/><rect x="64" y="442" width="1672" height="86" rx="14" class="pale"/><text x="104" y="478" class="k blue">CROSS-CUTTING CONTROL</text><text x="104" y="512" class="s ink">Role-aware access · audit history · documents as evidence · deterministic scoring · human decision ownership</text><text x="64" y="610" class="s muted">Closed, suspended, and rejected states remain traceable rather than disappearing from the operational record.</text></svg>