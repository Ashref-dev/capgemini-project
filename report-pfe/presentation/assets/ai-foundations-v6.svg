<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 660" role="img" aria-labelledby="title desc"><title id="title">Controlled AI foundation</title><desc id="desc">The IntelliConnect AI layer combines structured data, deterministic scoring, document evidence, and typed tools under human review.</desc><style>.ink{fill:#0b1826}.blue{fill:#0070ad}.muted{fill:#52687a}.pale{fill:#eaf5fa}.white{fill:#fff}.t{font:700 32px Arial,sans-serif}.s{font:500 21px Arial,sans-serif}.k{font:700 17px Arial,sans-serif;letter-spacing:2px}.node{fill:#fff;stroke:#0070ad;stroke-width:3}.link{fill:none;stroke:#0070ad;stroke-width:5}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4z" fill="#0070ad"/></marker></defs><text x="64" y="62" class="k blue">AI ASSISTANCE IS BUILT ON GOVERNED PLATFORM PRIMITIVES</text><circle cx="900" cy="322" r="132" class="pale" stroke="#0070ad" stroke-width="4"/><text x="900" y="306" text-anchor="middle" class="t ink">Controlled AI</text><text x="900" y="340" text-anchor="middle" class="s muted">grounded analysis</text><rect x="64" y="160" width="390" height="150" rx="16" class="node"/><text x="106" y="212" class="k blue">01 · FACTS</text><text x="106" y="255" class="t ink">Structured data</text><text x="106" y="286" class="s muted">Partners · projects · activities</text><rect x="64" y="390" width="390" height="150" rx="16" class="node"/><text x="106" y="442" class="k blue">02 · CALCULATION</text><text x="106" y="485" class="t ink">Deterministic scoring</text><text x="106" y="516" class="s muted">Weights · thresholds · reasons</text><rect x="1346" y="160" width="390" height="150" rx="16" class="node"/><text x="1388" y="212" class="k blue">03 · EVIDENCE</text><text x="1388" y="255" class="t ink">Document retrieval</text><text x="1388" y="286" class="s muted">Chunks · embeddings · citations</text><rect x="1346" y="390" width="390" height="150" rx="16" class="node"/><text x="1388" y="442" class="k blue">04 · CONTROL</text><text x="1388" y="485" class="t ink">Typed tools</text><text x="1388" y="516" class="s muted">Validated inputs · scoped actions</text><path d="M454 235C600 235 618 273 758 298M454 465C620 465 648 410 770 360M1346 235C1200 235 1180 273 1042 298M1346 465C1180 465 1154 410 1030 360" class="link" marker-end="url(#a)"/><rect x="380" y="572" width="1040" height="54" rx="27" class="blue"/><text x="900" y="608" text-anchor="middle" class="s white">Output: explainable answer, chart, or executive report — always reviewable.</text></svg>